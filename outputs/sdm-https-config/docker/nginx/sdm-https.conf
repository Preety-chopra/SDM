server {
    listen 443 ssl default_server;
    server_name sdm.dmrc.org;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/dmrc.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reject other hostnames without creating application sessions for them.
    if ($host != sdm.dmrc.org) {
        return 421;
    }

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host sdm.dmrc.org:5252;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host sdm.dmrc.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 5252;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;
    }
}
